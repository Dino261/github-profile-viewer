<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GitHub Profile Viewer</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <link rel="stylesheet" href="style.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/animejs/3.2.1/anime.min.js"></script>
</head>
<body>
    <!-- Top Navigation -->
    <nav class="top-nav">
        <div class="nav-container">
            <span class="nav-logo">GitHub Profile Viewer</span>
            <div class="nav-links">
                <a href="index.html" class="nav-link">Home</a>
                <a href="contact.html" class="nav-link">Contact</a>
            </div>
        </div>
    </nav>

    <div class="main-container">
        <!-- Header -->
        <header class="header">
            <h1>GitHub Profile Viewer</h1>
            <p>Look up any GitHub user's profile</p>
        </header>

        <!-- Search Section -->
        <section class="search-section">
            <div class="search-box">
                <input type="text" class="search-input" id="usernameInput" placeholder="Enter GitHub username">
                <button class="search-button" id="searchBtn">Search</button>
            </div>
        </section>

        <!-- Profile Display Section -->
        <section class="profile-section" id="profileSection">
            <div class="profile-card">
                <div class="profile-content">
                    <div class="profile-left">
                        <img src="" id="avatarImg" alt="Profile picture" class="profile-pic">
                        <h4 id="userName"></h4>
                        <p class="username" id="userLogin"></p>
                    </div>
                    <div class="profile-right">
                        <p id="userBio"></p>
                        <div class="stats">
                            <div class="stat-item">
                                <strong id="repoCount"></strong>
                                <p>Repositories</p>
                            </div>
                            <div class="stat-item">
                                <strong id="followerCount"></strong>
                                <p>Followers</p>
                            </div>
                            <div class="stat-item">
                                <strong id="followingCount"></strong>
                                <p>Following</p>
                            </div>
                        </div>
                        <div class="profile-link">
                            <a href="#" id="githubLink" class="github-link" target="_blank">View on GitHub</a>
                        </div>
                    </div>
                </div>
            </div>
        </section>
    </div>

    <!-- Footer -->
    <footer class="footer">
        <div class="footer-container">
            <div class="footer-social">
                <a href="#" class="social-link">Facebook</a>
                <a href="#" class="social-link">Twitter</a>
                <a href="#" class="social-link">Instagram</a>
                <a href="#" class="social-link">LinkedIn</a>
            </div>
            <div class="footer-nav">
                <a href="index.html" class="footer-nav-link">Home</a>
                <a href="contact.html" class="footer-nav-link">Contact</a>
            </div>
        </div>
    </footer>

    <script src="config.js"></script>
    <script src="script.js"></script>
</body>
</html>
